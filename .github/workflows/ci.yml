name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Tests don't need real env; the DB-integration suites self-skip without DIRECT_URL.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Dependency audit: fail on high+ severity advisories in PRODUCTION dependencies
      # (what we ship). Dev-only tooling (vitest/vite) is excluded — its advisories are
      # dev-server/test-UI issues that never reach the deployed app and would otherwise
      # force breaking major upgrades of the test runner.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
